{
    "device.node_id": "opencanary-1",
    "ip.ignorelist": [ ],
    "logtype.ignorelist": [ ],

    "ftp.enabled": true,
    "ftp.port": 21,
    "ftp.banner": "FTP server ready",
    "ftp.log_auth_attempt_initiated": true,

    "telnet.enabled": true,
    "telnet.port": 23,
    "telnet.banner": "",
    "telnet.max_connections": 64,
    "telnet.timeout": 120,
    "telnet.log_tcp_connection": true,

    "mysql.enabled": true,
    "mysql.port": 3306,
    "mysql.banner": "5.5.43-0ubuntu0.14.04.1",
    "mysql.log_connection_made": true,

    "http.enabled": true,
    "http.port": 8080,
    "http.banner": "Apache/2.2.22 (Ubuntu)",
    "http.skin": "nasLogin",
    "http.log_unimplemented_method_requests": false,
    "http.log_redirect_request": false,

    "ssh.enabled": true,
    "ssh.port": 2222,
    "ssh.version": "SSH-2.0-OpenSSH_5.1p1 Debian-4",
    "ssh.key_path": "/var/lib/opencanary",

    "portscan.enabled": false,
    "https.enabled": false,
    "httpproxy.enabled": false,
    "smb.enabled": false,
    "git.enabled": false,
    "llmnr.enabled": false,
    "redis.enabled": false,
    "rdp.enabled": false,
    "sip.enabled": false,
    "snmp.enabled": false,
    "ntp.enabled": false,
    "tftp.enabled": false,
    "tcpbanner.enabled": false,
    "mssql.enabled": false,
    "vnc.enabled": false,

    "logger": {
        "class": "PyLogger",
        "kwargs": {
            "formatters": {
                "plain": { "format": "%(message)s" }
            },
            "handlers": {
                "console": {
                    "class": "logging.StreamHandler",
                    "formatter": "plain",
                    "stream": "ext://sys.stdout"
                },
                "ntfy": {
                    "class": "pi_canary_ntfy.NtfyHandler",
                    "formatter": "plain",
                    "window": 60
                }
            }
        }
    }
}
