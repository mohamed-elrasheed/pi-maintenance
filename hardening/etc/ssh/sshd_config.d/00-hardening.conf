# /etc/ssh/sshd_config.d/00-hardening.conf - installed by hardening/harden.sh.
#
# Key-only SSH. Named 00- so it is read first: sshd keeps the FIRST value it
# sees for each setting, so this wins over later drop-ins such as a
# 50-cloud-init.conf that sets PasswordAuthentication yes.
#
# Undo: sudo rm /etc/ssh/sshd_config.d/00-hardening.conf && sudo systemctl reload ssh

# No passwords: stops password guessing and reused/leaked passwords.
PasswordAuthentication no
# Keyboard-interactive is the other route to a password prompt (via PAM).
KbdInteractiveAuthentication no
# Log in as your own user and use sudo; never as root directly.
PermitRootLogin no
